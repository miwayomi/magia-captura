name: captura

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: DIAGNOSTICO KVM
        run: |
          echo "=== kernel ==="
          uname -a
          echo "=== cpuinfo virt ==="
          grep -m1 -o -E "vmx|svm" /proc/cpuinfo || echo "NO vmx/svm en cpuinfo"
          echo "=== /dev/kvm ==="
          ls -l /dev/kvm 2>&1 || echo "NO EXISTE /dev/kvm"
          echo "=== grupos ==="
          id
          echo "=== kvm-ok ==="
          sudo apt-get install -y -qq cpu-checker >/dev/null 2>&1 || true
          sudo kvm-ok 2>&1 || true
          echo "=== lsmod kvm ==="
          lsmod | grep -i kvm || echo "sin modulos kvm"
          echo "=== nproc / mem ==="
          nproc
          free -h

  capturar:
    runs-on: ubuntu-latest
    needs: diag
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Instalar SDK
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd /tmp
          curl -sSL -o c.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q c.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          export PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/emulator" >> $GITHUB_PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "emulator" "platforms;android-30" "system-images;android-30;google_apis;x86_64" >/dev/null
          echo OK

      - name: Crear AVD
        run: |
          export PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH
          echo no | avdmanager create avd -n t -k "system-images;android-30;google_apis;x86_64" -d pixel_5 --force
          echo OK

      - name: Arrancar emulador (con diagnostico)
        run: |
          export PATH=$HOME/android-sdk/emulator:$HOME/android-sdk/platform-tools:$PATH
          ls -l /dev/kvm || echo "SIN KVM -> usaremos -accel off (lento)"
          ACCEL="-accel on"
          if [ ! -e /dev/kvm ]; then ACCEL="-accel off"; fi
          echo "usando: $ACCEL"
          nohup emulator -avd t -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot $ACCEL > /tmp/emu.log 2>&1 &
          EMUPID=$!
          echo "emulator pid=$EMUPID"
          # esperar device con timeout propio, no bloquear
          for i in $(seq 1 60); do
            if ! kill -0 $EMUPID 2>/dev/null; then
              echo "!!! EL EMULADOR MURIO. Log:"; cat /tmp/emu.log; exit 1
            fi
            D=$(adb devices | grep -c "emulator-")
            if [ "$D" -ge 1 ]; then echo "device visible en ${i}0s"; break; fi
            sleep 10
          done
          echo "=== emu.log (primeras 100 lineas) ==="
          head -100 /tmp/emu.log || true
          echo "=== adb devices ==="
          adb devices -l
          # esperar boot con timeout
          BOOT=0
          for i in $(seq 1 90); do
            B=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$B" = "1" ]; then BOOT=1; echo "BOOT OK en ${i}x10s"; break; fi
            sleep 10
          done
          if [ "$BOOT" != "1" ]; then
            echo "!!! BOOT TIMEOUT. emu.log:"; tail -120 /tmp/emu.log
            exit 1
          fi
          adb shell getprop ro.product.cpu.abi
          adb shell getprop ro.build.version.release

      - name: Root + APK
        run: |
          export PATH=$HOME/android-sdk/platform-tools:$PATH
          adb root 2>&1 || true
          sleep 5
          timeout 60 adb wait-for-device || true
          timeout 180 adb install -r app.apk 2>&1 || timeout 180 adb install app.apk 2>&1 || true
          adb shell pm list packages 2>/dev/null | grep -i -E "netxxus|msandroid" || echo "paquete NO listado"

      - name: Abrir app y esperar push
        run: |
          export PATH=$HOME/android-sdk/platform-tools:$PATH
          adb logcat -c 2>/dev/null || true
          adb shell monkey -p com.xuper.netxxus -c android.intent.category.LAUNCHER 1 2>&1 || true
          echo "esperando 200s..."
          sleep 200
          echo "=== proceso ==="
          adb shell ps -A 2>/dev/null | grep -i netxxus || echo "app no corriendo"

      - name: Capturar
        if: always()
        run: |
          export PATH=$HOME/android-sdk/platform-tools:$PATH
          mkdir -p out
          cp /tmp/emu.log out/emu.log 2>/dev/null || true
          adb logcat -d > out/logcat.txt 2>&1 || true
          adb shell ps -A > out/ps.txt 2>&1 || true
          adb shell "su 0 ls -la /data/data/com.xuper.netxxus/shared_prefs/" > out/prefs_ls.txt 2>&1 || true
          adb shell "su 0 cat /data/data/com.xuper.netxxus/shared_prefs/DomainCache.xml" > out/dc_su.xml 2>&1 || true
          adb shell "run-as com.xuper.netxxus cat shared_prefs/DomainCache.xml" > out/dc_runas.xml 2>&1 || true
          adb shell "su 0 find /data/data/com.xuper.netxxus -name '*.xml' -o -name '*.json'" > out/pkgls.txt 2>&1 || true
          grep -a -i -E "UMDomainHandler|PORTAL_MAIN|portal_main|netxxus" out/logcat.txt > out/hallazgos.txt 2>&1 || true
          echo "===== HALLAZGOS ====="
          cat out/hallazgos.txt || true
          echo "===== dc_su ====="
          cat out/dc_su.xml || true
          echo "===== prefs_ls ====="
          cat out/prefs_ls.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captura
          path: out/
          retention-days: 7
